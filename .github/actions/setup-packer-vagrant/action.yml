name: "Setup Packer and Vagrant"
description: "Installs Packer and Vagrant on the runner"

runs:
  using: "composite"
  steps:
    - name: Install Packer and Vagrant
      run: |
        if command -v packer &> /dev/null && command -v vagrant &> /dev/null; then
          echo "Packer and Vagrant already installed:"
          echo "  packer:  $(packer --version)"
          echo "  vagrant: $(vagrant --version)"
        else
          echo "Installing Packer and Vagrant..."
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer vagrant
        fi
      shell: bash

    - name: Install vagrant-libvirt plugin
      run: |
        if vagrant plugin list | grep -q vagrant-libvirt; then
          echo "vagrant-libvirt plugin already installed"
        else
          echo "Installing vagrant-libvirt plugin..."
          vagrant plugin install vagrant-libvirt
        fi
      shell: bash

    - name: Enforce setuid on qemu bridge helper
      run: sudo chmod u+s /usr/lib/qemu/qemu-bridge-helper
      shell: bash

    - name: Ensure /etc/qemu/bridge.conf exists
      run: |
        if [ ! -f /etc/qemu/bridge.conf ]; then
          sudo mkdir -p /etc/qemu
          echo "allow virbr0" | sudo tee /etc/qemu/bridge.conf
        fi
      shell: bash

    - name: Ensure vmlinuz is readable for libguestfs supermin
      run: sudo chmod 644 /boot/vmlinuz
      shell: bash
