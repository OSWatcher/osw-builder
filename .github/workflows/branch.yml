name: Capture Branch

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        description: "Branch to capture"
        default: "windows"
      only:
        type: string
        required: false
        description: "Only capture specific OS"
        default: null
      search_updates:
        type: string
        required: false
        description: "Search for updates"
        default: "true"

jobs:
  build_matrix:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          pat_token: ${{ secrets.PAT_TOKEN }}

      - name: Build Matrix
        id: set-matrix
        shell: poetry run python {0}
        run: |
          import yaml
          import os
          import json

          with open('osw_builder/default_settings.yaml', 'r') as file:
              data = yaml.safe_load(file)
              branches = data['branches']
              branch = '${{ github.event.inputs.branch }}' or 'master'
              os_list = branches[branch]
              only = '${{ github.event.inputs.only }}' or None
              if only:
                os_list = [os for os in os_list if os == only]

              # Reverse the os_list to start from the first commit
              os_list = os_list[::-1]

              # Create list of dictionaries with os_name and before parameter
              matrix_entries = []
              for i, os_entry in enumerate(os_list):
                  # Extract name from complex objects or use string directly
                  os_name = os_entry.get('name', os_entry) if isinstance(os_entry, dict) else os_entry
                  before_entry = os_list[i-1] if i > 0 else None
                  before = before_entry.get('name', before_entry) if isinstance(before_entry, dict) else before_entry
                  matrix_entries.append({
                      'os_name': os_name,
                      'before': before
                  })

              with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
                matrix = {
                  'include': matrix_entries
                }
                o.write(f'matrix={json.dumps(matrix)}')

  capture:
    needs: build_matrix
    strategy:
      matrix: ${{ fromJSON(needs.build_matrix.outputs.matrix) }}
      max-parallel: 1
    uses: ./.github/workflows/capture_os.yml
    with:
      os_name: ${{ matrix.os_name }}
      before: ${{ matrix.before }}
      search_updates: ${{ github.event.inputs.search_updates }}
      branch_name: ${{ github.event.inputs.branch }}
    secrets: inherit

  plugins_main_branch:
    needs: [capture]
    uses: ./.github/workflows/plugins.yml
    with:
      branch_name: ${{ inputs.branch }}
    secrets: inherit

  plugins_os_branch:
    needs: [capture, build_matrix, plugins_main_branch]
    uses: ./.github/workflows/plugins.yml
    strategy:
      matrix: ${{ fromJSON(needs.build_matrix.outputs.matrix) }}
      max-parallel: 1
    with:
      branch_name: ${{ matrix.os_name }}
    secrets: inherit
