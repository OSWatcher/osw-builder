name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.7
      uses: actions/setup-python@v1
      with:
        python-version: '3.7'
    - name: Lint
      run: |
        pip install nox
        nox -s lint
