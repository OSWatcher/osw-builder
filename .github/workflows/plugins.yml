name: Run Plugins

on:
  workflow_call:
    inputs:
      branch_name:
        type: string
        required: true
        description: 'Branch name to run plugins on'
      force_plugins:
        type: string
        required: false
        default: ''
        description: 'Comma-separated list of plugins to force rerun (e.g., "symbols" or "symbols,winreg")'

jobs:
  build_matrix:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Cleanup
        run: rm -rf *

      - run: |
          if [ -z "${{ inputs.branch_name }}" ]; then
            echo "Missing branch name"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
            submodules: 'recursive'
            token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
            pat_token: ${{ secrets.PAT_TOKEN }}
  
      - name: Build Matrix
        id: set-matrix
        shell: poetry run python {0}
        run: |
          import os
          import json
          from neogit.model.neo import Branch

          branch_name = '${{ inputs.branch_name }}'
          try:
            branch = Branch.nodes.get(name=branch_name)
          except Branch.DoesNotExist:
            print(f'Branch {branch_name} does not exist !')
            exit(1)
          else:
            def iter_commits():
              commit = branch.tracks.single()
              while commit:
                if commit.name == '${{ inputs.branch_name }}':
                  break
                yield commit
                # small hack to avoid reprocessing the same commit on the main branch
                if commit.name == 'IDLE':
                  break
                commit = commit.previous.single()
            # build matrix
            with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              matrix = {
                'commit': [{"name": commit.name, "hash": commit.hash} for commit in iter_commits()]
              }
              o.write(f'matrix={json.dumps(matrix)}')
  
  run_plugins:
    needs: build_matrix
    runs-on: self-hosted
    # check non empty matrix
    if: ${{ fromJson(needs.build_matrix.outputs.matrix).commit[0] != null }}
    strategy:
      matrix:
        commit: ${{ fromJson(needs.build_matrix.outputs.matrix).commit }}
      max-parallel: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          pat_token: ${{ secrets.PAT_TOKEN }}
          minio_secret: ${{ secrets.MINIO_ADMIN_PASSWD }}

      # Plugins must run sequentially: symbols depends on filetype (MIME type filtering)
      - name: Run filetype plugin
        run: |
          FORCE_FLAG=""
          if [[ ",${{ inputs.force_plugins }}," == *",filetype,"* ]]; then
            FORCE_FLAG="--force"
          fi
          poetry run runner $FORCE_FLAG ${{ matrix.commit.hash }} filetype

      - name: Run winreg plugin
        run: |
          FORCE_FLAG=""
          if [[ ",${{ inputs.force_plugins }}," == *",winreg,"* ]]; then
            FORCE_FLAG="--force"
          fi
          poetry run runner $FORCE_FLAG ${{ matrix.commit.hash }} winreg

      - name: Run symbols plugin
        run: |
          FORCE_FLAG=""
          if [[ ",${{ inputs.force_plugins }}," == *",symbols,"* ]]; then
            FORCE_FLAG="--force"
          fi
          poetry run runner $FORCE_FLAG ${{ matrix.commit.hash }} symbols
