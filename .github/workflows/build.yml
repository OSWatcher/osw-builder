name: Builder

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: docker://ghcr.io/oswatcher/builder:latest
      options: >-
        --volume /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
        --volume packer_cache:/packer_cache
        --device /dev/kvm
    steps:
      - name: Cleanup
        run: rm -f packer-build.log

      - name: Run command inside container
        run: osw-builder cpus=4
        env:
          PACKER_LOG: 1

      - name: Upload packer-build.log
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log
          path: packer-build.log
        if: always()
