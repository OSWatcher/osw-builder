name: Builder

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Cleanup
        run: rm -rf *

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install dependencies
        run: poetry install

      - name: build
        run: poetry run osw-builder --only-serie windows-10 cpus=4
        env:
          PACKER_LOG: 1
          NEOGIT_OBJECT__SECRET_KEY: ${{ secrets.MINIO_ADMIN_PASSWD }}
          PACKER_CACHE_DIR: /home/ops/.cache/packer

      - name: Upload packer-build.log
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log
          path: packer-build.log
        if: always()
