name: Builder

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: docker://ghcr.io/oswatcher/builder:latest
      options: --volume /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock

    steps:
      - name: Run command inside container
        run: poetry run osw-builder
