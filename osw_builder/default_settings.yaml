branches:
  master:
    # Box images (pre-built, no build_config needed)
    - name: *win95
      runtime_config:
        search_updates: false
        idle: false
    - *win98
    - *winME
    - *win2000
    
    # Packer-built Windows images - Sets base template, answerfile_path, and search_updates behavior
    - name: *winxp_sp3
      build_config:
        template: *win10_template
        varfiles: [*winxp_varfile]
        vars:
          answerfile_path: "./answer_files/xp/WINNT.SIF"
        # need to download dotnet 2.0
        image_name: "Windows XP Professional"
        network: true
      runtime_config:
        idle: true
        search_updates: false
    
    - name: *win7_7600
      build_config:
        varfiles: [*win7_varfile]
        vars:
          answerfile_path: "./answer_files/7/Autounattend.xml"
        key: *key_pro
        image_name: "Windows 7 Enterprise"
        extra_firstlogin_cmds: *win10_extra_firstlogin_cmds
      runtime_config:
        # too many problems disabling NewNetworkWindow and public network by default
        idle: false
    
    - name: *win8_9200
      build_config:
        varfiles: [*win8_varfile]
        vars:
          answerfile_path: "./answer_files/8/Autounattend.xml"
        key: *key_win8_pro
        image_name: *image_name_win8_pro
      runtime_config:
        idle: true
        search_updates: false
    
    - name: *win10_ts1_1507
      build_config:
        varfiles: [*win10_varfile]
        vars:
          answerfile_path: "./answer_files/10/Autounattend.xml"
        key: *key_pro
        image_name: *win10_pro
      runtime_config:
        search_updates: true

    # Windows 10 images inherit everything from win10_ts1_1507
    - *win10_ts2_1511_10586_0
    - *win10_ts2_1511_10586_104
    - *win10_ts2_1511_10586_164
    - *win10_rs1_1607_14393_0
    - *win10_rs2_1703_15063_0
    - *win10_rs3_1709_16299_15
    - *win10_rs4_1803_17134_1
    - *win10_rs5_1809_17763_1
    - *win10_rs5_1809_17763_107
    - *win10_rs5_1809_17763_379
    - *win10_19h1_1903_18362_30
    - *win10_19h1_1903_18362_356
    - *win10_19h2_1909_18363_418
    - *win10_20h1_2004_19041_264
    - *win10_20h2_2009_19042_631
    - *win10_21h1_19043_928
    - *win10_21h2_19044_1288
    - *win10_22h2_19045_2006
    
    # Windows 11 images - Changes to win11 varfile and adds network
    - name: *win11_21h2_22000_194
      build_config:
        varfiles: [*win11_varfile]
        key: *key_pro
        image_name: *win11_pro
        # win11 build needs internet access
        network: true

    # Windows 11 images inherit everything from win11_21h2_22000_194
    - *win11_21h2_22000_318
    - *win11_22h2_22621_384
    - *win11_23h2_22631_2861

  ubuntu-server:
    # Legacy preseed era (6.10-15.10) - Sets initial defaults
    - name: *ubuntu_6_10
      build_config:
        template: "ubuntu.pkr.hcl"
        varfiles:
          - "ubuntu.pkrvars/preseed.pkrvars.hcl"
        vars:
          boot_command_prefix: "<F6>"
          answerfile_path: "./answer_files/ubuntu/preseed.cfg"
          preseed_disk_device: "/dev/hda"
    - *ubuntu_7_04
    - name: *ubuntu_7_10
      build_config:
        vars:
          preseed_disk_device: "/dev/sda"
    - name: *ubuntu_8_04
      build_config:
        vars:
          boot_command_prefix: "<ESC><F6>"
    - *ubuntu_8_10
    - name: *ubuntu_9_04
      build_config:
        vars:
          boot_command_prefix: "<ESC><F6><ESC>"
    - *ubuntu_9_10
    - *ubuntu_10_04
    - *ubuntu_10_10
    - *ubuntu_11_04
    - *ubuntu_11_10
    - *ubuntu_12_04
    - *ubuntu_12_10
    - *ubuntu_13_04
    - *ubuntu_13_10
    - *ubuntu_14_04
    - *ubuntu_14_10
    - *ubuntu_15_04
    - *ubuntu_15_10
    - *ubuntu_16_04
    - *ubuntu_16_10
    # - *ubuntu_17_04
    - name: *ubuntu_17_10
      build_config:
        vars:
          preseed_extra_late_commands: >
            mkdir -p /target/etc/netplan;
            echo "network:" > /target/etc/netplan/01-dhcp.yaml;
            echo "  version: 2" >> /target/etc/netplan/01-dhcp.yaml;
            echo "  renderer: networkd" >> /target/etc/netplan/01-dhcp.yaml;
            echo "  ethernets:" >> /target/etc/netplan/01-dhcp.yaml;
            echo "    all-eth: " >> /target/etc/netplan/01-dhcp.yaml;
            echo "      match: " >> /target/etc/netplan/01-dhcp.yaml;
            echo "        name: \"e*\"" >> /target/etc/netplan/01-dhcp.yaml;
            echo "      dhcp4: true" >> /target/etc/netplan/01-dhcp.yaml;
            echo "      optional: true" >> /target/etc/netplan/01-dhcp.yaml;

    - name: *ubuntu_18_04
      build_config:
        vars:
          # Since Ubuntu 18.04, GRUB Timeout is very short
          boot_wait: 2s
    - *ubuntu_18_10
    - *ubuntu_19_04
