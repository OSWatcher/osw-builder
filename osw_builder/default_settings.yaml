extra_firstlogin_cmds:
  &win10_extra_firstlogin_cmds # disable automated Windows Updates (ask to download and ask to install)
  - 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v AUOptions /d 2 /t REG_DWORD /f'
  # include recommended Windows Updates
  - 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v IncludeRecommendedUpdates /d 1 /t REG_DWORD /f'
  # exclude drivers from Windows Updates
  - 'reg.exe add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate" /v ExcludeWUDriversInQualityUpdate /d 1 /t REG_DWORD /f'
  # disable password expiration for all accounts
  - "cmd /c net accounts /maxpwage:unlimited"

